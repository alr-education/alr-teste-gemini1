<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike8</title>
    <link rel="stylesheet" href="styles.css">
</head>
<div class="tab-bar">
    <button class="tab-button active" onclick="navigateTo('chat')">Chat</button>
    <button class="tab-button" onclick="navigateTo('perfil')">Meu Perfil</button>
    <button class="tab-button" onclick="navigateTo('jornada')">Minha Jornada</button>
</div>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>Chat</h1>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-container">
      <input type="text" id="user-input" placeholder="Digite sua mensagem...">
      <button id="send-button">Enviar</button>
    </div>
    
    <div class="tab-bar"> <!-- ISSO ESTÁ DENTRO da chat-container -->
      <button class="tab-button active">Chat</button>
      <button class="tab-button">Perfil</button>
      <button class="tab-button">Jornada</button>
    </div>
  </div>
</body>
</html>
